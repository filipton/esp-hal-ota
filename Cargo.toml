[package]
name = "esp-hal-ota"
version = "0.7.1"
edition = "2024"
license = "MIT"
description = "OTA library for esp-hal"
repository = "https://github.com/filipton/esp-hal-ota"

autoexamples = false # examples/ is its own crate

[lib]

[dependencies]
embedded-storage = "0.3.2"
esp-rom-sys = { version = "0.1.5", optional = true }
log = { version = "0.4.34", optional = true }
defmt = { version = "1.2.0", optional = true }

esp32 = { version = "0.41.0", optional = true }

esp32s2 = { version = "0.32.0", optional = true }
esp32s3 = { version = "0.36.0", optional = true }

esp32c2 = { version = "0.30.0", optional = true }
esp32c3 = { version = "0.33.0", optional = true }
esp32c6 = { version = "0.24.0", optional = true }

esp32h2 = { version = "0.20.0", optional = true }

[features]
default = []
log = ["dep:log"]
defmt = ["dep:defmt"]

esp32 = ["dep:esp32", "esp-rom-sys/esp32"]

esp32s2 = ["dep:esp32s2", "esp-rom-sys/esp32s2"]
esp32s3 = ["dep:esp32s3", "esp-rom-sys/esp32s3"]

esp32c2 = ["dep:esp32c2", "esp-rom-sys/esp32c2"]
esp32c3 = ["dep:esp32c3", "esp-rom-sys/esp32c3"]
esp32c6 = ["dep:esp32c6", "esp-rom-sys/esp32c6"]

esp32h2 = ["dep:esp32h2", "esp-rom-sys/esp32h2"]
